name: Farmivo Production Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Production Android Artifacts
  # ---------------------------------------------------------------------------
  release-android:
    name: Build Android Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Rename Artifacts with Version
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ inputs.tag_name }}}
          cp build/app/outputs/flutter-apk/app-release.apk farmivo-${VERSION}-android.apk
          cp build/app/outputs/bundle/release/app-release.aab farmivo-${VERSION}-android.aab

      - name: Upload Android Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android-assets
          path: |
            farmivo-*-android.apk
            farmivo-*-android.aab
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Build Production Web PWA
  # ---------------------------------------------------------------------------
  release-web:
    name: Build Web Release (PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --pwa-strategy=offline-first

      - name: Archive Web Distribution
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ inputs.tag_name }}}
          tar -czf farmivo-${VERSION}-web-pwa.tar.gz -C build/web .

      - name: Upload Web Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-web-assets
          path: farmivo-*-web-pwa.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Publish GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release-android, release-web]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Assets
        uses: actions/download-artifact@v4
        with:
          name: release-android-assets
          path: release-assets/

      - name: Download Web Assets
        uses: actions/download-artifact@v4
        with:
          name: release-web-assets
          path: release-assets/

      - name: Determine Release Tag
        id: release_info
        run: |
          TAG=${GITHUB_REF_NAME:-${{ inputs.tag_name }}}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: Farmivo Release ${{ steps.release_info.outputs.TAG }}
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: false

